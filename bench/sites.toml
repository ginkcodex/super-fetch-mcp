# Real sites for bench/run.py. `expect` is text that only shows up when the real page came through.
# Mark sites `flaky` when they judge IP reputation, so a block there isn't counted as a regression.

[[site]]
name = "example"
category = "static"
url = "https://example.com/"
expect = "documentation examples"


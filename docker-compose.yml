# super-fetch as a shared MCP server over plain HTTP on port 8000, for Cloudflare (or another proxy)
# to put HTTPS in front of. See "Run it on a server" in README.md. On the server:
#
#   echo "SUPER_FETCH_HTTP_ALLOWED_HOSTS=fetch.ginklab.cv" > .env   # the public domain agents connect to
#   echo "SUPER_FETCH_HTTP_TOKEN=$(openssl rand -hex 32)" >> .env
#   docker compose up -d --build
#
# With a Cloudflare Tunnel (cloudflared on this machine), add SUPER_FETCH_HTTP_BIND=127.0.0.1 so the
# port isn't reachable from outside. Docker-published ports bypass ufw.

services:
  super-fetch:
    build: .
    image: super-fetch
    command: ["serve", "--http"]
    environment:
      SUPER_FETCH_HTTP_HOST: 0.0.0.0
      SUPER_FETCH_HTTP_TOKEN: ${SUPER_FETCH_HTTP_TOKEN:?set SUPER_FETCH_HTTP_TOKEN in .env}
      SUPER_FETCH_HTTP_ALLOWED_HOSTS: ${SUPER_FETCH_HTTP_ALLOWED_HOSTS:?set SUPER_FETCH_HTTP_ALLOWED_HOSTS in .env}
      # Server IPs are distrusted by bot protection; a residential proxy helps (see README "Limits").
      SUPER_FETCH_PROXY: ${SUPER_FETCH_PROXY:-}
      # Refuse pages Google Safe Browsing lists as dangerous (see README).
      SUPER_FETCH_SAFE_BROWSING_KEY: ${SUPER_FETCH_SAFE_BROWSING_KEY:-}
    ports:
      - "${SUPER_FETCH_HTTP_BIND:-0.0.0.0}:${SUPER_FETCH_HTTP_PORT:-8000}:8000"
    shm_size: 1g
    volumes:
      - super-fetch-data:/data
    restart: unless-stopped

volumes:
  super-fetch-data:

# super-fetch as a shared MCP server at http://<server>:8000/mcp (see "Run it on a server" in
# README.md). On the server:
#
#   echo "SUPER_FETCH_HTTP_ALLOWED_HOSTS=fetch.example.com" > .env   # the domain or IP agents connect to
#   echo "SUPER_FETCH_HTTP_TOKEN=$(openssl rand -hex 32)" >> .env
#   docker compose up -d --build
#
# Plain HTTP: the token travels unencrypted, so anyone on the network path can read and reuse it.

services:
  super-fetch:
    build: .
    image: super-fetch
    command: ["serve", "--http"]
    environment:
      SUPER_FETCH_HTTP_HOST: 0.0.0.0
      SUPER_FETCH_HTTP_TOKEN: ${SUPER_FETCH_HTTP_TOKEN:?set SUPER_FETCH_HTTP_TOKEN in .env}
      SUPER_FETCH_HTTP_ALLOWED_HOSTS: ${SUPER_FETCH_HTTP_ALLOWED_HOSTS:?set SUPER_FETCH_HTTP_ALLOWED_HOSTS in .env}
      # Server IPs are distrusted by bot protection; a residential proxy helps (see README "Limits").
      SUPER_FETCH_PROXY: ${SUPER_FETCH_PROXY:-}
    ports:
      - "${SUPER_FETCH_HTTP_PORT:-8000}:8000"
    shm_size: 1g
    volumes:
      - super-fetch-data:/data
    restart: unless-stopped

volumes:
  super-fetch-data:

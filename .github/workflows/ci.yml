name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: Install the browser's system packages and Xvfb
        run: sudo .venv/bin/playwright install-deps firefox

      # The browser is a large download; `super-fetch install` only fetches it when missing or outdated
      # (and always sets up the fingerprint model inside the fresh virtualenv).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: camoufox-${{ runner.os }}-
      - run: uv run super-fetch install

      # Tests that need the internet (SUPER_FETCH_NETWORK_TESTS) are left out: CI runners' IPs get
      # challenged and blocked far more than a desktop, so they would fail for reasons outside the code.
      - run: uv run pytest -q
